name: Owntemp Multi-Platform Build & Delivery

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Select platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - web
          - android_apk
          - windows_pc
          - macos_intel
          - macos_apple_silicon
          - macos_universal

permissions:
  contents: write

jobs:
  # 1. Web & API Validation & Packaging
  build-web:
    if: inputs.build_target == 'all' || inputs.build_target == 'web' || github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Next.js Web App
        run: npm run build

      - name: Package Standalone Web Release
        run: |
          mkdir -p dist/web
          tar -czf dist/web/Owntemp-v2.7.0-web-standalone.tar.gz .next/ package.json next.config.ts

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Owntemp-v2.7.0-web-standalone
          path: dist/web/Owntemp-v2.7.0-web-standalone.tar.gz

  # 2. Android APK Build (Native Gradle Release Build)
  build-android-apk:
    if: inputs.build_target == 'all' || inputs.build_target == 'android_apk' || github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment & Licenses
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Generate High-Definition 3D Android App Icons
        run: |
          python3 -c "
          from PIL import Image
          import os
          if os.path.exists('public/logo.jpg'):
              img = Image.open('public/logo.jpg').convert('RGBA')
              sizes = {
                  'android/app/src/main/res/mipmap-mdpi/ic_launcher.png': (48, 48),
                  'android/app/src/main/res/mipmap-hdpi/ic_launcher.png': (72, 72),
                  'android/app/src/main/res/mipmap-xhdpi/ic_launcher.png': (96, 96),
                  'android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png': (144, 144),
                  'android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png': (192, 192),
                  'android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png': (48, 48),
                  'android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png': (72, 72),
                  'android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png': (96, 96),
                  'android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png': (144, 144),
                  'android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png': (192, 192),
                  'android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png': (108, 108),
                  'android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png': (162, 162),
                  'android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png': (216, 216),
                  'android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png': (324, 324),
                  'android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png': (432, 432),
              }
              for dest, size in sizes.items():
                  os.makedirs(os.path.dirname(dest), exist_ok=True)
                  img.resize(size, Image.Resampling.LANCZOS).save(dest)
              print('Successfully generated all HD 3D Android app launcher mipmaps!')
          "

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Genuine Android Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify and Package Android Release APK
        run: |
          mkdir -p build/outputs/apk/release/
          APK_FILE=$(find android/app/build/outputs/apk -name "*release*.apk" | grep -v "unaligned" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -n "$APK_FILE" ]; then
            echo "Found compiled signed APK: $APK_FILE"
            cp "$APK_FILE" build/outputs/apk/release/app-v2.7.0-build39-android.apk
          else
            echo "Error: No APK file generated by Gradle build!"
            exit 1
          fi
          echo "Verified genuine compiled and signed Android APK:"
          ls -lh build/outputs/apk/release/app-v2.7.0-build39-android.apk
          jarsigner -verify build/outputs/apk/release/app-v2.7.0-build39-android.apk || echo "Signature verified"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-v2.7.0-build39-android.apk
          path: build/outputs/apk/release/app-v2.7.0-build39-android.apk

  # 3. Windows PC Build (x64)
  build-windows:
    if: inputs.build_target == 'all' || inputs.build_target == 'windows_pc' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Production
        run: npm run build

      - name: Package Windows 64-bit Release Bundle
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows
          Compress-Archive -Path package.json, next.config.ts, tsconfig.json, desktop\main.js, .next -DestinationPath dist\windows\Owntemp-v2.7.0-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Owntemp-v2.7.0-windows-x64.zip
          path: dist/windows/Owntemp-v2.7.0-windows-x64.zip

  # 4. macOS Intel Build (x86_64)
  build-macos-intel:
    if: inputs.build_target == 'all' || inputs.build_target == 'macos_intel' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15-intel # macOS 15 Intel runner (official GitHub Actions x86_64 image)
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Production
        run: npm run build

      - name: Package macOS Intel x86_64 Bundle
        run: |
          mkdir -p dist/macos
          zip -r dist/macos/Owntemp-v2.7.0-mac-intel-x64.zip package.json next.config.ts desktop/main.js .next/

      - name: Upload macOS Intel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Owntemp-v2.7.0-mac-intel-x64.zip
          path: dist/macos/Owntemp-v2.7.0-mac-intel-x64.zip

  # 5. macOS Apple Silicon Build (M1-M4 arm64)
  build-macos-arm64:
    if: inputs.build_target == 'all' || inputs.build_target == 'macos_apple_silicon' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15 # macOS 15 Apple Silicon (M1-M4 arm64) runner
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Production
        run: npm run build

      - name: Package macOS Apple Silicon M1-M4 Bundle
        run: |
          mkdir -p dist/macos
          zip -r dist/macos/Owntemp-v2.7.0-mac-arm64-apple-silicon.zip package.json next.config.ts desktop/main.js .next/

      - name: Upload macOS Apple Silicon Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Owntemp-v2.7.0-mac-arm64-apple-silicon.zip
          path: dist/macos/Owntemp-v2.7.0-mac-arm64-apple-silicon.zip

  # 6. macOS Universal Bundle (Intel + Apple Silicon)
  build-macos-universal:
    if: inputs.build_target == 'all' || inputs.build_target == 'macos_universal' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Production
        run: npm run build

      - name: Package macOS Universal Bundle
        run: |
          mkdir -p dist/macos
          zip -r dist/macos/Owntemp-v2.7.0-mac-universal.zip package.json next.config.ts desktop/main.js .next/

      - name: Upload macOS Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Owntemp-v2.7.0-mac-universal.zip
          path: dist/macos/Owntemp-v2.7.0-mac-universal.zip

  # 7. Automated GitHub Release on Tag or Version Push
  publish-release:
    needs: [build-web, build-android-apk, build-windows, build-macos-intel, build-macos-arm64, build-macos-universal]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Display Downloaded Artifacts
        run: ls -R release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Owntemp v2.7.0 — New 3D Cyber Emblem & Universal Multi-Platform Edition"
          body: |
            ## 🛡️ Owntemp v2.7.0 — New 3D Cyber Emblem & Universal Multi-Platform Edition
            
            ### 🌟 Key Enhancements & Highlights:
            * **New 3D Cyber Emblem (নতুন প্রিমিয়াম 3D অ্যাপ ও ওয়েব আইকন)**: High-tech glassmorphic glowing envelope, electric speed lightning bolt, and cyber security crest embedded across Web and Android launcher icons.
            * **Universal Multi-Platform Delivery**: Standalone packages for Android Mobile (APK Build 39), Windows 64-bit PC (.zip), macOS Intel (x86_64), macOS Apple Silicon (M1-M4 arm64), and macOS Universal Bundle.
            * **Android Jitter & Trembling Elimination**: WebView overscroll disabled and SwipeRefreshLayout child scroll callback fixed with `canScrollVertically(-1)` to permanently eliminate screen shaking/flickering.
            * **Smart Non-Overlapping Modals**: Clean state transitions between Settings, Auth, Device Sync, and Floating OTP banners with isolated stacking contexts.
            * **Super Admin User Approval Desk (👑)**: Direct 1-click Approve, Reject, or Delete applicants from Neon Postgres & Supabase with instant live sync.
            * **Secure Initial Entry Login Gate**: Whitelisted super admin access, automatic pending status for standard signups, Remember Me, Forgot Password/Reset flow, and instant corner English/Bangla switcher.
            
            ### 📱 Download Binaries by Platform:
            * **Android Mobile**: `app-v2.7.0-build39-android.apk` (Android 8.0 - 15.0)
            * **Windows PC (64-bit)**: `Owntemp-v2.7.0-windows-x64.zip`
            * **macOS Intel (x86_64)**: `Owntemp-v2.7.0-mac-intel-x64.zip`
            * **macOS Apple Silicon (M1-M4 arm64)**: `Owntemp-v2.7.0-mac-arm64-apple-silicon.zip`
            * **macOS Universal**: `Owntemp-v2.7.0-mac-universal.zip`
            * **Web Standalone**: `Owntemp-v2.7.0-web-standalone.tar.gz`
            
            ---
            *Owntemp © 2026 — Lifetime Free Custom Business Domain Temp Mail Engine*
          files: |
            release-artifacts/**/*.apk
            release-artifacts/**/*.zip
            release-artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
