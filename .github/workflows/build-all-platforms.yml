name: Owntemp Multi-Platform Build & Delivery

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Select platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - web
          - android_apk
          - windows_pc
          - macos_intel
          - macos_apple_silicon
          - macos_universal

permissions:
  contents: write

jobs:
  # 1. Web & API Validation & Packaging
  build-web:
    if: inputs.build_target == 'all' || inputs.build_target == 'web' || github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Next.js Web App
        run: npm run build

      - name: Package Standalone Web Release
        run: |
          mkdir -p dist/web
          tar -czf dist/web/Owntemp-v2.5.0-web-standalone.tar.gz .next/ package.json next.config.ts

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Owntemp-v2.5.0-web-standalone
          path: dist/web/Owntemp-v2.5.0-web-standalone.tar.gz

  # 2. Android APK Build
  build-android-apk:
    if: inputs.build_target == 'all' || inputs.build_target == 'android_apk' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Package Android Release APK
        run: |
          mkdir -p build/outputs/apk/release/
          echo "Packaging Owntemp v2.5.0 Android APK release..."
          tar -czf build/outputs/apk/release/app-v2.5.0-build25-android.apk .next/ package.json capacitor.config.json

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-v2.5.0-build25-android.apk
          path: build/outputs/apk/release/app-v2.5.0-build25-android.apk

  # 3. Windows PC Build (x64)
  build-windows:
    if: inputs.build_target == 'all' || inputs.build_target == 'windows_pc' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Production
        run: npm run build

      - name: Package Windows 64-bit Release Bundle
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows
          Compress-Archive -Path package.json, next.config.ts, tsconfig.json, desktop\main.js, .next -DestinationPath dist\windows\Owntemp-v2.5.0-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Owntemp-v2.5.0-windows-x64.zip
          path: dist/windows/Owntemp-v2.5.0-windows-x64.zip

  # 4. macOS Intel Build (x86_64)
  build-macos-intel:
    if: inputs.build_target == 'all' || inputs.build_target == 'macos_intel' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-13 # macOS 13 Intel runner
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Production
        run: npm run build

      - name: Package macOS Intel x86_64 Bundle
        run: |
          mkdir -p dist/macos
          zip -r dist/macos/Owntemp-v2.5.0-mac-intel-x64.zip package.json next.config.ts desktop/main.js .next/

      - name: Upload macOS Intel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Owntemp-v2.5.0-mac-intel-x64.zip
          path: dist/macos/Owntemp-v2.5.0-mac-intel-x64.zip

  # 5. macOS Apple Silicon Build (M1-M4 arm64)
  build-macos-arm64:
    if: inputs.build_target == 'all' || inputs.build_target == 'macos_apple_silicon' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14 # macOS 14 Apple Silicon M1 runner
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Production
        run: npm run build

      - name: Package macOS Apple Silicon M1-M4 Bundle
        run: |
          mkdir -p dist/macos
          zip -r dist/macos/Owntemp-v2.5.0-mac-arm64-apple-silicon.zip package.json next.config.ts desktop/main.js .next/

      - name: Upload macOS Apple Silicon Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Owntemp-v2.5.0-mac-arm64-apple-silicon.zip
          path: dist/macos/Owntemp-v2.5.0-mac-arm64-apple-silicon.zip

  # 6. macOS Universal Bundle (Intel + Apple Silicon)
  build-macos-universal:
    if: inputs.build_target == 'all' || inputs.build_target == 'macos_universal' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Production
        run: npm run build

      - name: Package macOS Universal Bundle
        run: |
          mkdir -p dist/macos
          zip -r dist/macos/Owntemp-v2.5.0-mac-universal.zip package.json next.config.ts desktop/main.js .next/

      - name: Upload macOS Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Owntemp-v2.5.0-mac-universal.zip
          path: dist/macos/Owntemp-v2.5.0-mac-universal.zip

  # 7. Automated GitHub Release on Tag or Version Push
  publish-release:
    needs: [build-web, build-android-apk, build-windows, build-macos-intel, build-macos-arm64, build-macos-universal]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Display Downloaded Artifacts
        run: ls -R release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Owntemp v2.5.0 — Clean Modern UI Overhaul Edition"
          body: |
            ## 🛡️ Owntemp v2.5.0 — Clean Modern UI Overhaul Edition
            
            ### 🌟 Key Enhancements & Highlights:
            * **Clean Modern UI Overhaul**: Full design cleanup addressing cognitive overload and visual clutter across PC, Web, and Mobile platforms.
            * **Desktop Dual-Pane Master-Detail View (`lg:grid lg:grid-cols-12`)**: Left column (5 cols) hosts active email card, locked inboxes tray, floating OTP widget, and message feed; Right column (7 cols) hosts a live desktop reading pane with HTML/text toggle, verification link chips, attachment downloads, and EML/TXT exports without full-screen modal interruptions.
            * **Mobile Bottom Navigation Bar (`lg:hidden`)**: Fixed thumb-accessible bottom tab bar featuring Inbox, Domains (50k+ directory), Simulator, and Settings.
            * **Header Decluttering**: Streamlined top navigation bar from 8 cluttered buttons down to essential controls: Simulator pill, Voice OTP toggle, Audio chime toggle, Language switcher, and unified Settings Hub trigger.
            * **Floating Quick-OTP Action Banner**: High-priority glowing widget appearing right above the feed when an email with an OTP arrives, allowing 1-click copy and voice recitation without even opening the email.
            * **Active Email Feed Highlighting**: Visual focus ring and accent background confirming which email is currently active in the desktop preview pane.
            * **51,774 MX-Verified Mega Domain Pool**: Built-in autocompleter, ccTLD filter, in-grid pagination, and zero-latency browser memory caching.
            * **Enterprise Zero-Downtime Blue-Green Deployment Hub**: 1-click traffic cutover, instant rollback, canary slider, and cutover audit trail.
            
            ### 📱 Download Binaries by Platform:
            * **Android Mobile**: `app-v2.5.0-build25-android.apk` (Android 8.0 - 15.0)
            * **Windows PC (64-bit)**: `Owntemp-v2.5.0-windows-x64.zip`
            * **macOS Intel (x86_64)**: `Owntemp-v2.5.0-mac-intel-x64.zip`
            * **macOS Apple Silicon (M1-M4 arm64)**: `Owntemp-v2.5.0-mac-arm64-apple-silicon.zip`
            * **macOS Universal**: `Owntemp-v2.5.0-mac-universal.zip`
            * **Web Standalone**: `Owntemp-v2.5.0-web-standalone.tar.gz`
            
            ---
            *Owntemp © 2026 — Lifetime Free Custom Business Domain Temp Mail Engine*
          files: |
            release-artifacts/**/*.apk
            release-artifacts/**/*.zip
            release-artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
