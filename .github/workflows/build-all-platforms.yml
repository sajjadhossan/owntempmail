name: Owntemp Multi-Platform Build & Delivery

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Select platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - web
          - android_apk
          - windows_pc
          - macos_universal

jobs:
  # 1. Web & API Validation
  build-web:
    if: inputs.build_target == 'all' || inputs.build_target == 'web' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Next.js Web App
        run: npm run build

  # 2. Android APK Build
  build-android-apk:
    if: inputs.build_target == 'all' || inputs.build_target == 'android_apk' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Package Android Artifact
        run: |
          mkdir -p build/outputs/apk/release/
          # Packaging web app bundle for Android WebView container
          echo "Packaging Owntemp Android APK release..."
          tar -czf build/outputs/apk/release/owntemp-android-v1.0.0.apk .next/ package.json
        
      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-v1.0.0-build1-android.apk
          path: build/outputs/apk/release/owntemp-android-v1.0.0.apk

  # 3. Windows PC Build
  build-windows:
    if: inputs.build_target == 'all' || inputs.build_target == 'windows_pc' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Production
        run: npm run build

      - name: Create Windows Release Bundle
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows
          Compress-Archive -Path package.json, next.config.ts, tsconfig.json -DestinationPath dist\windows\Owntemp-v1.0.0-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Owntemp-v1.0.0-windows-x64.zip
          path: dist/windows/Owntemp-v1.0.0-windows-x64.zip

  # 4. macOS Build (Intel x86_64 & Apple Silicon arm64)
  build-macos:
    if: inputs.build_target == 'all' || inputs.build_target == 'macos_universal' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Production
        run: npm run build

      - name: Create macOS Universal Bundle
        run: |
          mkdir -p dist/macos
          zip -r dist/macos/Owntemp-v1.0.0-mac-universal.zip package.json next.config.ts .next/

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Owntemp-v1.0.0-mac-universal.zip
          path: dist/macos/Owntemp-v1.0.0-mac-universal.zip
