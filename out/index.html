<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Owntemp</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px;
      background-color: #0b0f19; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; text-align: center;
    }
    .logo-badge {
      width: 64px; height: 64px; border-radius: 16px;
      background: linear-gradient(135deg, #6366f1, #9333ea);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 16px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { margin: 0 0 8px; font-size: 24px; font-weight: 700; }
    p { margin: 0 0 24px; font-size: 14px; color: #94a3b8; }
    .card {
      background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px; padding: 20px; width: 100%; max-width: 360px;
    }
    input {
      width: 100%; padding: 12px 14px; background: #0f172a;
      border: 1px solid #334155; border-radius: 10px; color: #fff;
      font-size: 14px; margin-bottom: 12px; outline: none;
    }
    input:focus { border-color: #6366f1; }
    button {
      width: 100%; padding: 12px; background: #6366f1; color: white;
      border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:active { background: #4f46e5; }
  </style>
</head>
<body>
  <div class="logo-badge">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
  </div>
  <h1>Owntemp Mobile</h1>
  <p id="status-text">Connecting to Owntemp web instance...</p>
  <div class="spinner" id="loader"></div>

  <div class="card" id="config-card" style="display: none;">
    <p style="font-size: 12px; margin-bottom: 12px;">Enter your Owntemp Web / Vercel instance URL to connect:</p>
    <input type="url" id="server-input" placeholder="https://your-owntemp.vercel.app" value="https://owntemp.live" />
    <button onclick="saveAndConnect()">Connect Now</button>
  </div>

  <script>
    const savedUrl = localStorage.getItem('owntemp_server_url') || 'https://owntemp.live';
    
    function tryRedirect(url) {
      document.getElementById('status-text').innerText = 'Loading ' + url + '...';
      setTimeout(() => {
        window.location.href = url;
      }, 500);
    }

    function saveAndConnect() {
      const input = document.getElementById('server-input').value.trim();
      if (!input) return;
      const formatted = input.startsWith('http') ? input : 'https://' + input;
      localStorage.setItem('owntemp_server_url', formatted);
      tryRedirect(formatted);
    }

    // Try auto-redirect to savedUrl after 1.2s, or show config card if user cancels
    setTimeout(() => {
      tryRedirect(savedUrl);
    }, 1200);

    // If still here after 4s (e.g. offline or slow network), show server input card
    setTimeout(() => {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('config-card').style.display = 'block';
      document.getElementById('status-text').innerText = 'Select or enter your server URL:';
    }, 4000);
  </script>
</body>
</html>
